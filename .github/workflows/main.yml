name: Create Archive
on:
  release:
    types:
      - created
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master
      - name: Archive Release
        # git archive honours the export-ignore list in .gitattributes, so the
        # zip carries only what a store installs.
        run: git archive --format=zip --output=monei-module-monei-payment.zip HEAD

      - name: Upload Release
        uses: ncipollo/release-action@v1.12.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: 'monei-module-monei-payment.zip'
          artifactContentType: 'application/zip'
          token: ${{ secrets.GITHUB_TOKEN }}
